# "creature concept art", NOT "trading card game art". Measured on 6 identical
# seeds: the TCG phrasing cues SD to paint a COMPLETE card - ornate border plus a
# name plate of garbled pseudo-text - in 2 of 6 draws, which no amount of
# `frame, border, text` in NEGATIVE overrides, because it is the positive prompt
# asking for it. A baked-in frame violates ADR-005 (SD draws the art window only;
# frame and name are DOM/CSS) and would double up against the CSS frame.
# Re-running the same 4 seeds with the wording below: 0 frames, 0 name plates.
style: &style >-
  fantasy creature concept art, centered character portrait,
  painterly digital illustration, dramatic rim lighting, dark background

# The vault's QUALITY tail is "highly detailed, sharp focus, artstation trending, 8k".
# Measured against the real CLIP tokenizer that tail costs 12 tokens, which pushed the
# five longest recipes to 78-80 tokens - over CLIP's hard limit of 77. CLIP truncates
# silently from the END, so the block being dropped was QUALITY itself, and only on the
# legendary/epic/mythic recipes (their rarity fragments are the longest: 12/16/18 tokens).
# Dropping "artstation trending" costs 4 tokens and brings the worst case to 76. STYLE and
# every rarity fragment stay exactly as specified - the rarity modifier is what makes
# rarity readable from a thumbnail, so it is the last thing that should lose tokens.
quality: &quality "highly detailed, sharp focus, 8k"

negative: &negative >-
  text, letters, words, watermark, signature, logo, frame, border, ui,
  blurry, low quality, jpeg artifacts, deformed, disfigured, bad anatomy,
  extra limbs, extra fingers, mutated hands, cropped, out of frame,
  multiple heads, duplicate, photo, 3d render

archetypes:
  beast: "a fearsome fantasy beast creature, scales and fur, wild eyes"
  humanoid: "a fantasy warrior character, ornate armor, determined expression"
  undead: "an undead revenant, hollow glowing eyes, tattered shroud, bone"
  # "golem", not "construct": measured on 3 seeds, the wording "an animated stone
  # and metal construct" produced two elves and a beast and not one construct -
  # "construct" is a weak token, and STYLE's "character portrait" pulls toward
  # faces. "golem" plus the material nouns anchors it; the same 3 seeds then gave
  # 3 constructs. Archetype fidelity matters because `archetype` is a filterable
  # field in inventory and admin, not just flavour.
  # Kept deliberately short: the mythic rarity fragment is the longest in the set,
  # and "riveted iron plates" pushed construct_light_mythic to 81 tokens, past
  # CLIP's 77 - the tail drops silently. "golem" carries the meaning on its own.
  construct: "a massive stone golem, carved rock body, glowing runic core"
  spirit: "an ethereal spirit entity, translucent flowing form, wisps"

elements:
  fire: "wreathed in ember and flame, molten cracks, smoke"
  water: "flowing water and ice, deep blue glow, mist"
  earth: "stone, moss and crystal growths, earthen tones"
  air: "swirling wind and storm clouds, crackling lightning"
  shadow: "shrouded in dark purple void mist, sinister glow"
  light: "radiant golden holy light, halo, divine glow"

rarities:
  common:
    fragment: "simple, plain, muted colors, humble"
    cfg_scale: 6.0
    steps: 22
  uncommon:
    fragment: "modest detail, slight magical aura"
    cfg_scale: 6.5
    steps: 25
  rare:
    fragment: "intricate detail, glowing magical energy"
    cfg_scale: 7.0
    steps: 28
  epic:
    fragment: "highly ornate, powerful magical aura, energy swirling, majestic"
    cfg_scale: 7.5
    steps: 30
  legendary:
    fragment: "legendary artifact, radiant golden aura, epic scale, awe-inspiring, god rays"
    cfg_scale: 8.0
    steps: 35
  mythic:
    fragment: "cosmic mythic entity, reality-bending aura, celestial energy, overwhelming divine presence, galaxy"
    cfg_scale: 8.5
    steps: 40

